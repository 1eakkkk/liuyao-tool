<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>结构化解读 · 离线验证</title>
<style>
:root{font-family:system-ui,"Microsoft YaHei",sans-serif;color:#352e29;background:#f6f2eb;line-height:1.7}*{box-sizing:border-box}body{margin:0}main{max-width:1000px;margin:42px auto;padding:0 22px}header p{color:#766c64}h1{font-size:30px;line-height:1.3}h2{font-size:21px}h3{font-size:16px}article,.panel{background:#fffdf9;border:1px solid #e5ddd0;border-radius:16px;padding:24px;margin:20px 0}button{background:#763c32;color:#fff;border:0;border-radius:8px;padding:11px 16px;cursor:pointer;margin:6px 7px 6px 0;font:inherit}button.secondary{background:#eee6db;color:#463e37}textarea{display:block;width:100%;min-height:220px;border:1px solid #d6cabc;border-radius:8px;padding:12px;font:13px/1.6 monospace;resize:vertical}summary{cursor:pointer;color:#763c32;font-weight:600}details>section{border-top:1px solid #eee6dc;padding:6px 0}p,li,pre{overflow-wrap:anywhere;white-space:pre-wrap}pre{font:13px/1.7 monospace}small{color:#766c64}.actions{display:flex;flex-wrap:wrap}#status{min-height:28px;color:#685f54}.tag{color:#763c32;font-size:13px;letter-spacing:.15em}#prompt{min-height:180px}@media(max-width:500px){main{margin:24px auto;padding:0 14px}.panel,article{padding:18px}h1{font-size:25px}}
</style></head><body><main>
<header><span class="tag">开发预览 · 无 API 调用</span><h1>先读结论，再查看依据</h1><p>使用现有测试卦盘演示结构化回答。仅在本地校验，不保存回复，不上传到服务器。</p></header>
<article id="result" aria-live="polite"><p>正在准备离线样例……</p></article>
<div class="panel"><h2>验证一段回复</h2><p>加载样例，或粘贴按照下方提示词生成的完整 JSON 回复。</p>
<div class="actions"><button id="sample">加载有效样例</button><button id="invalid" class="secondary">试试虚构引用</button><button id="partial" class="secondary">试试生成中断</button></div>
<label for="response">待校验回复</label><textarea id="response" spellcheck="false"></textarea><button id="validate">校验并显示</button><p id="status" role="status"></p>
<details><summary>查看并复制外部 AI 提示词</summary><p>外部 AI 的回复需要带回此页校验。当前样例不代表真实实验结果。</p><textarea id="prompt" readonly aria-label="外部 AI 提示词"></textarea><button id="copy">复制提示词</button></details></div>
<small>格式和引用一致，不代表预测正确。此页面未接入正式站点。</small>
</main><script type="module" src="./app.js"></script></body></html>
